version: '3.8'

services:
  # PostgreSQL Database Container
  postgres:
    image: postgres:16-alpine
    container_name: aura_postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: aura_health_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/src/models/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Node.js Express Backend Service
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: aura_backend_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/aura_health_db
      JWT_SECRET: aura_super_secure_jwt_secret_key_2026_production
      CORS_ORIGIN: http://localhost:5173
    ports:
      - '5000:5000'
    volumes:
      - ./server/uploads:/app/uploads

volumes:
  postgres_data:
